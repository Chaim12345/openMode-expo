name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Inject network security config into Android project
        run: |
          # Copy network_security_config.xml to Android res/xml/
          mkdir -p android/app/src/main/res/xml
          cp assets/network_security_config.xml android/app/src/main/res/xml/network_security_config.xml

          # Add android:networkSecurityConfig attribute to <application> tag in AndroidManifest.xml
          sed -i 's/<application /<application android:networkSecurityConfig="@xml\/network_security_config" /' android/app/src/main/AndroidManifest.xml

          # Verify the change
          grep -n 'networkSecurityConfig' android/app/src/main/AndroidManifest.xml

      - name: Validate Gradle wrapper
        working-directory: android
        run: chmod +x ./gradlew

      - name: Build release APK (standalone, no Metro required)
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: openmode-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
